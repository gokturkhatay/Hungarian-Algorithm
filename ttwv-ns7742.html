<!doctype html>
<meta charset="utf-8">
<title>TTWV test</title>
<h1>TTWV_START_NOSUCHENTRY7742</h1>
<iframe id="target" width="640" height="480"></iframe>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const target = params.get("target") || "https://example.com/";
  const run = params.get("run") || "NOSUCHENTRY7742";
  document.querySelector("#target").src = target;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  await sleep(3500);
  const out = { run, bridge: false, methods: [], aggregated: "", current: null, historical: null, errors: {} };
  try {
    const bridge = window.ttwebview;
    out.bridge = !!bridge;
    if (bridge) {
      out.methods = Object.getOwnPropertyNames(bridge).sort();
      try { out.aggregated = String(await bridge.getAggregatedInnerText()); }
      catch (e) { out.errors.aggregated = String(e); }
      try { out.current = await bridge.getCurrentSecondJumpData(); }
      catch (e) { out.errors.current = String(e); }
      try { out.historical = await bridge.getHistoricalSecondJumpData(); }
      catch (e) { out.errors.historical = String(e); }
    }
  } catch (e) { out.errors.top = String(e); }
  const clean = (value) => String(value).replace(/\s+/g, " ").slice(0, 320);
  document.querySelector("h1").textContent = [
    "TTWV", run, out.bridge, out.methods.length,
    "A=" + clean(out.aggregated),
    "C=" + clean(JSON.stringify(out.current)),
    "H=" + clean(JSON.stringify(out.historical)),
    "E=" + clean(JSON.stringify(out.errors))
  ].join("|");
})();
</script>
